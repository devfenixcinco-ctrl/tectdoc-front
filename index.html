<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/fenix.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fuentes: conexión anticipada y solo los pesos que usa el sitio (sin cursivas) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Se carga sin bloquear el primer render (las fuentes usan display=swap) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Public+Sans:wght@100..900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Public+Sans:wght@100..900&display=swap" /></noscript>
    <title>TecDoc</title>
  </head>
  <body>
    <!-- Pantalla de carga: se ve mientras llega el JavaScript (evita la pantalla en
         blanco); src/main.js la quita cuando la app se monta -->
    <style>
      #app-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;color:#fff;font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      #app-loader span{width:40px;height:40px;border:4px solid rgba(255,255,255,.2);border-top-color:#FF4338;border-radius:50%;animation:app-loader-spin .8s linear infinite}
      @keyframes app-loader-spin{to{transform:rotate(360deg)}}
    </style>
    <div id="app-loader" role="status"><span></span>Cargando catálogo de autopartes…</div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
